# Сервер 3 ансамбля из трёх копий ZooKeeper 3.9.6 на одной машине.
# Строки server.N одинаковые во всех трёх файлах; у каждой копии свои clientPort,
# admin.serverPort и dataDir, иначе серверы мешали бы друг другу.

# Базовая единица времени, мс. Сессия клиента может жить от 2 до 20 тиков (4–40 с).
tickTime=2000
# Сколько тиков последователь может синхронизироваться с лидером при подключении.
initLimit=10
# Сколько тиков последователь может отставать от лидера.
syncLimit=5

# Снимки и журнал транзакций. Путь относительный: сервер запускается из папки своей копии (zookeeper/zk3).
# В этой же папке лежит myid с номером сервера — по нему сервер находит свою строку server.3.
dataDir=data

# Порт для клиентов (zkCli, координаторы).
clientPort=2183
# AdminServer (HTTP) по умолчанию слушает 8080 — у трёх копий на одной машине порты должны различаться.
admin.serverPort=8083
# Четырёхбуквенные команды для проверки состояния: echo srvr | nc 127.0.0.1 2183
4lw.commands.whitelist=srvr,stat,mntr,ruok,conf

# Участники ансамбля: server.<myid>=<хост>:<порт обмена с лидером>:<порт выборов лидера>
server.1=127.0.0.1:2888:3888
server.2=127.0.0.1:2889:3889
server.3=127.0.0.1:2890:3890
